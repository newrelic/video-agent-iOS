name: Publish to SPM

# Publishes the files that ios-release.yml built and signed on the release branch. Nothing is
# rebuilt here: the release PR already contains Package.swift with the checksums of those files,
# so the tag goes on the merged commit itself (no bot commit, no moved tag, no sync PR).
#
# CocoaPods Trunk is read-only from Dec 2, 2026, so only SPM (XCFramework zips + GitHub Release)
# is published.

on:
  pull_request:
    types:
      - closed
    branches:
      - master

  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Head commit of the release PR whose build to publish (the sha in the artifact name ios-release-<sha>)'
        required: true
        type: string
      dry_run:
        description: 'Run every check but do not create the release'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if the PR was merged and has the release label, or when started by hand
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))

    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}

    steps:
      - name: Checkout the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Extract version from podspec
        id: get_version
        run: |
          VERSION=$(grep "s.version" NewRelicVideoAgent.podspec | sed -E "s/.*s\.version[[:space:]]*=[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "MERGED=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION"

      # A published release is immutable, so a re-run can only continue from a draft.
      - name: Stop if this version is already published
        if: env.DRY_RUN != 'true'
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
        run: |
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate | jq -r --arg t "$TAG_NAME" '.[] | select(.tag_name == $t) | "\(.id) \(.draft)"')
          if [ -z "$EXISTING" ]; then
            echo "No release for $TAG_NAME yet."
            exit 0
          fi
          read -r ID DRAFT <<< "$EXISTING"
          if [ "$DRAFT" != "true" ]; then
            echo "::error::$TAG_NAME is already published and cannot be changed. Bump the version and release again."
            exit 1
          fi
          echo "Deleting the leftover draft for $TAG_NAME from an earlier failed run."
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"

      - name: Download the build made on the release PR
        run: |
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ios-release-$HEAD_SHA" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No build found for release PR head $HEAD_SHA. Run the Version Bump PR workflow again to build the latest commit, then publish."
            exit 1
          fi
          echo "Using the build from run $RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "ios-release-$HEAD_SHA" -D build
          ls -l build

      - name: Check the merged commit is exactly what was built
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          jq -e --arg v "$VERSION" --arg h "$HEAD_SHA" '.version == $v and .headCommit == $h' build/build-info.json
          BUILT=$(jq -r .builtCommit build/build-info.json)
          git fetch -q origin "$HEAD_SHA" "$BUILT"

          # What was merged must be the release branch head, tree for tree.
          if [ "$(git rev-parse "$MERGED^{tree}")" != "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            echo "::error::The merged commit differs from the build's commit $HEAD_SHA (more commits landed). Run the Version Bump PR workflow again to rebuild, then publish."
            exit 1
          fi
          # The only change after the build is the Package.swift update.
          CHANGED=$(git diff --name-only "$BUILT" "$HEAD_SHA")
          if [ "$CHANGED" != "Package.swift" ]; then
            echo "::error::Files changed between the built commit $BUILT and $HEAD_SHA besides Package.swift:"
            echo "$CHANGED"
            exit 1
          fi
          echo "OK: tag commit = merged commit = release branch head; built from $BUILT; only Package.swift changed."

      - name: Verify checksums, Package.swift and attestations
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
        run: |
          cd build
          sha256sum -c SHA256SUMS
          cd ..
          grep -q "let releaseTag = \"$TAG_NAME\"" Package.swift
          for fw in NewRelicVideoCore NRAVPlayerTracker NRIMATracker NRMediaTailorTracker NRTHEOplayerTracker; do
            SUM=$(sha256sum "build/$fw.xcframework.zip" | cut -d' ' -f1)
            grep -q "checksum: \"$SUM\"" Package.swift
            echo "$fw: Package.swift checksum matches the zip"
          done
          cd build
          for f in xcframeworks.zip NewRelicVideoCore.xcframework.zip NRAVPlayerTracker.xcframework.zip NRIMATracker.xcframework.zip NRMediaTailorTracker.xcframework.zip NRTHEOplayerTracker.xcframework.zip SHA256SUMS integrity-manifest.json; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ios-release.yml"
          done

      - name: Extract changelog excerpt
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          VERSION_REGEX=$(echo "$VERSION" | sed 's/\./\\./g')
          start=$(grep -n "^## \[$VERSION_REGEX\]" CHANGELOG.md | cut -d: -f1)

          if [ -z "$start" ]; then
            CHANGELOG="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details."
          else
            end=$(awk -v start="$start" 'NR > start && /^## \[/ {print NR; exit}' CHANGELOG.md)
            if [ -z "$end" ]; then
              tail -n +"$((start+1))" CHANGELOG.md > excerpt.txt
            else
              sed -n "$((start+1)),$((end-1))p" CHANGELOG.md > excerpt.txt
            fi
            CHANGELOG=$(cat excerpt.txt)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # Draft first, upload every file, check them, then publish: files cannot be
          # added or changed once published (immutable releases). The tag is created at
          # publish, on the merged commit.
          NOTES="## Release $TAG_NAME

          Available via Swift Package Manager — see [Package.swift](https://github.com/$GITHUB_REPOSITORY/blob/$TAG_NAME/Package.swift).

          ### What's Changed

          $CHANGELOG"

          FILES="xcframeworks.zip NewRelicVideoCore.xcframework.zip NRAVPlayerTracker.xcframework.zip NRIMATracker.xcframework.zip NRMediaTailorTracker.xcframework.zip NRTHEOplayerTracker.xcframework.zip SHA256SUMS integrity-manifest.json"

          gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes "$NOTES" --target "$MERGED"
          (cd build && gh release upload "$TAG_NAME" $FILES --clobber)

          # Check what is on the draft matches the verified files before publishing.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate | jq -r --arg t "$TAG_NAME" '.[] | select(.tag_name == $t) | .assets[] | "\(.name) \(.digest // "")"' | sort > "$RUNNER_TEMP/uploaded.txt"
          (cd build && for f in $FILES; do echo "$f sha256:$(sha256sum "$f" | cut -d' ' -f1)"; done) | sort > "$RUNNER_TEMP/expected.txt"
          diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/uploaded.txt"

          gh release edit "$TAG_NAME" --draft=false

      - name: Trigger Release Notes Docs PR
        if: env.DRY_RUN != 'true'
        run: |
          gh workflow run release-notes-docs-pr.yml --ref master --field tag="${{ steps.get_version.outputs.tag }}" --field dry_run=false
          echo "Triggered release-notes-docs-pr.yml for ${{ steps.get_version.outputs.tag }}"

      - name: Verify publication
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN $TAG_NAME: every check passed; the release was not created."
            exit 0
          fi
          git fetch -q --tags origin
          echo "tag commit:    $(git rev-parse "$TAG_NAME^{commit}")"
          echo "merged commit: $MERGED"
          test "$(git rev-parse "$TAG_NAME^{commit}")" = "$MERGED"
          gh release view "$TAG_NAME" >/dev/null && echo "GitHub Release $TAG_NAME - verified"
          git show "$TAG_NAME:Package.swift" | grep -q "let releaseTag = \"$TAG_NAME\"" && echo "Package.swift at $TAG_NAME - verified"
          echo "Users can now install $TAG_NAME via Swift Package Manager (see Package.swift)."
